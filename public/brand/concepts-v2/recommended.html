<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TalkForge — V2 Recommended Directions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0c0b0a; color: #f3eee4; font-family: Georgia, serif; min-height: 100vh; padding: 48px 24px; }
    h1 { text-align: center; font-size: 28px; margin-bottom: 8px; }
    .sub { text-align: center; color: #9a9080; font-size: 14px; margin-bottom: 48px; font-family: system-ui, sans-serif; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; max-width: 1200px; margin: 0 auto; }
    figure { text-align: center; width: 300px; }
    figure img { width: 260px; height: 260px; display: block; margin: 0 auto 16px; border: 1px solid #2a2622; }
    figcaption { font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: 0.08em; color: #a67c52; text-transform: uppercase; }
    figcaption strong { display: block; color: #f3eee4; font-size: 18px; letter-spacing: 0; text-transform: none; margin-top: 6px; font-family: Georgia, serif; }
  </style>
</head>
<body>
  <h1>TalkForge — V2 directions (not finals)</h1>
  <p class="sub">Transformation · relief · no forge/flame/spark</p>
  <div class="row">
    <figure>
      <img src="24-slit-threshold.svg" alt="Slit Threshold" />
      <figcaption>Lead craft candidate<strong>Slit Threshold</strong></figcaption>
    </figure>
    <figure>
      <img src="16-door-ajar.svg" alt="Door Ajar" />
      <figcaption>Relief / permission<strong>Door Ajar</strong></figcaption>
    </figure>
    <figure>
      <img src="20-span.svg" alt="Span Bridge" />
      <figcaption>Mission crossing<strong>Span</strong></figcaption>
    </figure>
  </div>
</body>
</html>
