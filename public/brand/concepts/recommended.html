<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TalkForge — Recommended Logos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0c0b0a;
      color: #f3eee4;
      font-family: Georgia, "Iowan Old Style", serif;
      min-height: 100vh;
      padding: 40px 24px 80px;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .sub {
      text-align: center;
      color: #9a9080;
      font-size: 14px;
      margin-bottom: 48px;
      font-family: system-ui, sans-serif;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    figure {
      text-align: center;
      width: 320px;
    }
    figure img {
      width: 280px;
      height: 280px;
      display: block;
      margin: 0 auto 16px;
      border: 1px solid #2a2622;
      background: #0a0a0a;
    }
    figcaption {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: #c4a574;
      text-transform: uppercase;
    }
    figcaption strong {
      display: block;
      color: #f3eee4;
      font-size: 18px;
      letter-spacing: 0;
      text-transform: none;
      margin-top: 6px;
      font-family: Georgia, serif;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>TalkForge — Top 3 recommended marks</h1>
  <p class="sub">Directional sketches · not production finals</p>
  <div class="row">
    <figure>
      <img src="35-horizon.svg" alt="Horizon logo" />
      <figcaption>Lead recommendation<strong>Horizon</strong></figcaption>
    </figure>
    <figure>
      <img src="27-orbit-spark.svg" alt="Orbit Spark logo" />
      <figcaption>Minimal alternative<strong>Orbit Spark</strong></figcaption>
    </figure>
    <figure>
      <img src="09-weight-split.svg" alt="Weight Split wordmark" />
      <figcaption>Required wordmark<strong>Weight Split</strong></figcaption>
    </figure>
  </div>
</body>
</html>
