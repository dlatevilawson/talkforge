<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TalkForge — Brand Concept Board (BID-005)</title>
  <style>
    :root {
      --bg: #0c0b0a;
      --fg: #f3eee4;
      --muted: #9a9080;
      --line: #2a2622;
      --accent: #c4a574;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background:
        radial-gradient(ellipse at 20% 0%, #1a1612 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #16120e 0%, transparent 45%),
        var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }
    header {
      padding: 3rem 1.5rem 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-weight: 600;
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    .brand {
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      max-width: 40rem;
      line-height: 1.55;
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      padding: 1.5rem;
      max-width: 1100px;
      margin: 0 auto 4rem;
    }
    .card {
      margin: 0;
      border: 1px solid var(--line);
      background: #12100e;
      padding: 0.75rem;
      transition: border-color 180ms ease, transform 180ms ease;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      background: #0a0a0a;
    }
    figcaption {
      margin-top: 0.6rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
